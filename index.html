<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tableau de bord financier - Suivez les actions et indices boursiers en temps réel">
    <meta name="keywords" content="bourse, finance, actions, trading, investissement, CAC 40">
    <title>Tableau de Bord Financier</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tableau de Bord Financier</h1>
            <p class="subtitle">Recherchez des actions en temps réel</p>
        </header>

        <!-- Barre de recherche -->
        <div class="search-section">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <input type="text" id="searchInput" placeholder="Rechercher une action (ex: Apple, Microsoft, Tesla)" autocomplete="off">
                    <div id="autocompleteResults" class="autocomplete-results hidden"></div>
                </div>
                <button id="searchBtn">Rechercher</button>
            </div>
        </div>

        <!-- Résultat de la recherche -->
        <div id="searchResult" class="result-card hidden">
            <div class="result-header">
                <h2 id="resultSymbol"></h2>
                <span id="resultType" class="badge"></span>
            </div>
            <div id="resultContent"></div>
        </div>

        <!-- Message d'erreur -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- ETF PEA Européens -->
        <div class="etf-section">
            <div id="etfAccordion" class="etf-accordion">
                <!-- Les ETF seront générés dynamiquement par JavaScript -->
                <div class="etf-item loading">
                    <div class="etf-header">
                        <span>Chargement des ETF...</span>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Données fournies par Yahoo Finance</p>
            <p class="footer-note">Projet open source - Hébergé sur GitHub Pages</p>
</footer>
    </div>

    <!-- Script JavaScript -->
    <script src="app.js"></script>
</body>
</html>

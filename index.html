<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tableau de bord des ETF PEA européens - Suivi en temps réel des ETF éligibles au PEA">
    <meta name="keywords" content="ETF, PEA, bourse, finance, investissement, ETF PEA, MSCI World, S&P 500">
    <title>Tableau de Bord - ETF PEA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ETF PEA Européens</h1>
            <p class="subtitle">Suivi en temps réel des ETF éligibles au PEA</p>
        </header>

        <!-- ETF PEA Européens -->
        <div class="etf-section">
            <div id="etfAccordion" class="etf-accordion">
                <!-- Les ETF seront générés dynamiquement par JavaScript -->
                <div class="etf-item loading">
                    <div class="etf-header">
                        <span>Chargement des ETF...</span>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Données fournies par Yahoo Finance</p>
            <p class="footer-note">Projet open source - Hébergé sur GitHub Pages</p>
</footer>
    </div>

    <!-- Script JavaScript -->
    <script src="app.js"></script>
</body>
</html>
